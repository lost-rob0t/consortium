[project]
name = "consortium"
slug = "consortium"

[control_plane]
runtime = "prolog-rlm"
workflow = "adard"
fresh_context_per_phase = true
hidden_transcript_transfer = false
transport = "jsonl-stdio"
async_boundary = true

[adard]
phases = ["analyze", "design", "adversarial_review", "resolve", "develop", "verify"]
require_analysis_before_design = true
require_review_before_resolve = true
require_approval_before_develop = true
require_exact_head_verification = true

[budgets]
max_revisions_per_phase = 1
max_rage_cycles = 3
require_explicit_token_budget = true
require_explicit_stop_condition = true

[rage]
enabled = true
mode = "tool"
auto_escalate_local_failures = false

[models]
provider = "openrouter"
# z.ai via OpenRouter. OPENROUTER_API_KEY must be present in the daemon
# environment (the emacs layer injects it from auth-source when unset).
root-agent = "z-ai/glm-4.6"
analyze = "z-ai/glm-4.6"
design = "z-ai/glm-4.6"
adversarial_review = "z-ai/glm-4.6"
resolve = "z-ai/glm-4.6"
develop = "z-ai/glm-4.6"
verify = "z-ai/glm-4.6"

# Codex through any OpenAI-compatible endpoint. The credential is the NAME
# of an environment variable ("OPENAI_API_KEY" by default); the daemon
# resolves it at request time and secrets never travel over the protocol.
# Per-run wire options:
#   options.worker = "rlm"
#   options.provider = "codex"
#   options.endpoint = "https://api.openai.com/v1/chat/completions"
#   options.credential_env = "OPENAI_API_KEY"
#   options.models.<role> = "gpt-5-codex"
[models.codex]
provider = "codex"
endpoint = "https://api.openai.com/v1/chat/completions"
credential-env = "OPENAI_API_KEY"
root-agent = "gpt-5-codex"
analyze = "gpt-5-codex"
design = "gpt-5-codex"
adversarial_review = "gpt-5-codex"
resolve = "gpt-5-codex"
develop = "gpt-5-codex"
verify = "gpt-5-codex"

[events]
schema = "consortium.event.v1"
push = true
replay = true

[artifacts]
backend = "prolog-rlm"
max_packet_artifacts = 16
max_packet_chars = 12000
