name: ci

on:
  push:
    branches: [main, "adard/**"]
  pull_request:

jobs:
  flake-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact requested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Resolve updated Prolog-RLM lock
        run: |
          nix flake lock --update-input prolog-rlm
          echo '---BEGIN-FLAKE-LOCK---'
          cat flake.lock
          echo '---END-FLAKE-LOCK---'

      - name: Check flake
        run: nix flake check --show-trace

      - name: Build default package
        run: nix build .#default --no-link --print-build-logs

      - name: Run packaged help
        run: nix run . -- --help

      - name: Reject whitespace errors
        run: |
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" HEAD
          git diff --check
